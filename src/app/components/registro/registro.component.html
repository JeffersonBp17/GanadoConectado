<div class="container">
    <div class="d-flex flex-wrap justify-content-center">
        <div class="card">
            <div class="card-body">
                <h1>Registro de Usuario</h1>
                <!-- [formGroup] : se usa para el manejo del formulario, (ngSubmit) se usa para manejar la acción del submit -->
                <form id="registration-form" [formGroup]="registroForm" (ngSubmit)="registrar()" ngNativeValidate>
                    <label for="fullname">Nombre Completo:</label>
                    <input type="text" id="fullname" formControlName="Nombre" required>
                    <!-- formControlName : se usa para obtener el valor de cada input -->
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" formControlName="Correo" required>
                    <label for="password">Contraseña (al menos 8 carácteres):</label>
                    <input type="password" id="password" minlength="8" formControlName="Contrasena" required>
                    <br /> <br />
                    <button class="btn btn-lg btn-register" type="submit">Registrar</button>
                    <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a></p>
                </form>
            </div>

        </div>
    </div>
</div>
