<div class="whatsapp-button-container">
    <button (click)="openWhatsApp()" class="whatsapp-button">
        <img src="whatsapp-icon.png" alt="WhatsApp" class="whatsapp-icon"> WhatsApp
    </button>
</div>



<div class="container">
    <div class="image-container">
        <img src="Logo.jpg" alt="Imagen de Ganado">
    </div>
    <h1>Ganado Conectado</h1> 
    <!-- Formulario de Inicio de Sesión -->
    <form id="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()"> 
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" formControlName="email" required>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" formControlName="password" required>
        
        <button type="submit">Iniciar Sesión</button>
        <p>¿No tienes cuenta? <a href="/registro">Regístrate aquí</a></p>
    </form>
    
    <!-- Botón de Login con Google -->
    <button (click)="login()">Login with Google</button>
    
   
</div>
