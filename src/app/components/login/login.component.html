
<div class="container">
    <div class="d-flex flex-wrap justify-content-center">
        <div class="card">
            <div class="image-container">
                <img src="Logo.jpg" alt="Imagen de Ganado">
            </div>
            <h1>Ganado Conectado</h1> 
            <!-- Formulario de Inicio de Sesión -->
            <form id="login-form" [formGroup]="loginForm" (ngSubmit)="login()"> 
                <label for="email">Correo Electrónico:</label>
                <input class="form-control-lg" type="email" id="email" formControlName="Correo" required>
                
                <label for="password">Contraseña:</label>
                <input class="form-control-lg" type="password" id="password" formControlName="Contrasena" required>
                <br/> <br/>
                <button class="btn btn-lg btn-login" type="submit">Iniciar Sesión</button>
                <p>¿No tienes cuenta? <a href="/registro">Regístrate aquí</a></p>
            </form>
            
            <!-- Botón de Login con Google -->
            <button class="btn btn-lg btn-outline-success google-btn" (click)="loginGoogle()">Iniciar Sesión con Google</button>
        </div> 
    </div>
   
</div>
