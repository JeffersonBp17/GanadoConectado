<div class="container">
    <!-- Sección dinámica para gestionar ganado -->
    <div id="livestock-section">
        <h2 id="section-title">Gestión de Ganado</h2>
        
        <!-- Formulario dinámico para agregar ganado -->
        <div id="add-livestock">
            <h3>Añadir Ganado</h3>
            <form id="livestock-form">                
                <div id="purchase-fields">
                    <label for="toro-id">Número de Toro:</label>
                    <input type="text" id="toro-id">
                    
                    <label for="purchase-date">Fecha de Compra:</label>
                    <input type="date" id="purchase-date">
                    
                    <label for="purchase-weight">Peso de Compra (kg):</label>
                    <input type="number" id="purchase-weight">
                    
                    <label for="purchase-location">Lugar de Compra:</label>
                    <input type="text" id="purchase-location">
                    
                    <label for="arrival-weight">Peso de Llegada a la Finca (kg):</label>
                    <input type="number" id="arrival-weight">
                    
                    <label for="batch-number">Lote N°:</label>
                    <input type="text" id="batch-number">
                </div>
    
                <button type="submit">Agregar</button>
            </form>
        </div>
        
        <!-- Listado de ganado -->
        <div id="livestock-list">
            <h3>Lista de Ganado</h3>
            <ul id="livestock-items">
                <!-- Aquí se listarán los toros o vacas añadidos -->
            </ul>
        </div>
    </div>
</div>
